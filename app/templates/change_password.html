<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>修改密码 · AgentSwarm</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#1f2937}.card{width:min(460px,100%);padding:34px;border:1px solid #e5e7eb;border-radius:18px;background:#fff;box-shadow:0 20px 60px rgba(15,23,42,.1)}h1{margin:0 0 8px;font-size:23px}p{margin:0 0 22px;color:#6b7280}.notice{padding:12px 14px;border-radius:9px;background:#fff7ed;color:#9a3412;margin-bottom:18px}.error{padding:10px 12px;border-radius:9px;background:#fef2f2;color:#b91c1c;margin-bottom:14px}label{display:grid;gap:7px;margin-top:15px;font-weight:600}input{padding:11px 12px;border:1px solid #d1d5db;border-radius:9px;font:inherit;outline:none}input:focus{border-color:#0053db;box-shadow:0 0 0 3px rgba(0,83,219,.1)}button{width:100%;margin-top:23px;padding:11px;border:0;border-radius:9px;background:#0053db;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body><main class="card">
  <h1>设置新密码</h1><p>密码修改成功后才能进入 AgentSwarm 工作台。</p>
  {% if session.get('must_change_password') %}<div class="notice">首次登录必须修改默认密码。</div>{% endif %}
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>当前密码<input name="current_password" type="password" autocomplete="current-password" required autofocus></label>
    <label>新密码<input name="new_password" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>确认新密码<input name="confirmation" type="password" autocomplete="new-password" minlength="8" required></label>
    <button type="submit">保存并进入工作台</button>
  </form>
</main></body>
</html>
