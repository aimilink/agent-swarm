<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · AgentSwarm</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f6f9ff,#eef2ff 48%,#fafafa);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#1f2937}.card{width:min(430px,100%);padding:34px;border:1px solid #e5e7eb;border-radius:18px;background:#fff;box-shadow:0 24px 70px rgba(30,64,175,.12)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#0053db,#7c3aed);color:#fff;font-size:19px;font-weight:800}.brand b{display:block;font-size:19px}.brand small{color:#9ca3af;letter-spacing:.08em}h1{font-size:23px;margin:0 0 6px}p{margin:0;color:#6b7280}.hint{margin:22px 0;padding:14px 16px;border:1px solid #bfdbfe;border-radius:10px;background:#eff6ff;color:#1e40af}.hint b{display:block;margin-bottom:3px}.error{margin:16px 0;padding:10px 12px;border-radius:9px;background:#fef2f2;color:#b91c1c}label{display:grid;gap:7px;margin-top:16px;font-weight:600}input{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:9px;font:inherit;outline:none}input:focus{border-color:#0053db;box-shadow:0 0 0 3px rgba(0,83,219,.1)}button{width:100%;margin-top:22px;padding:11px;border:0;border-radius:9px;background:#0053db;color:#fff;font:inherit;font-weight:700;cursor:pointer}.foot{margin-top:18px;text-align:center;font-size:12px;color:#9ca3af}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">A</span><span><b>AgentSwarm</b><small>POWERED BY HERMES</small></span></div>
    <h1>登录工作台</h1><p>登录后可管理 Agent、项目与工作空间。</p>
    {% if show_default %}<div class="hint"><b>首次登录默认凭据</b>账号：{{ username }}<br>密码：{{ default_password }}<br><small>登录成功后必须修改密码。</small></div>{% endif %}
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label>账号<input name="username" autocomplete="username" value="{{ username }}" required autofocus></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">登录</button>
    </form>
    <div class="foot">本地与可信内网工作台</div>
  </main>
</body>
</html>
